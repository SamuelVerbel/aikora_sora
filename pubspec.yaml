name: aikora_sora
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  image_picker: ^1.0.5
  http: ^1.2.1
  url_launcher: ^6.3.0
  geolocator: ^12.0.0
  
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.6.0
  google_sign_in: ^6.2.1
  provider: ^6.1.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/google.png
    - assets/logo/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21

dependency_overrides:
  objective_c: 9.2.4