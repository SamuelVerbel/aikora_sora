name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK + Web
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # ☕️ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 🐦 Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # 📦 Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🔐 Create env.dart
      - name: Create env.dart
        run: |
          mkdir -p lib/core/config
          cat <<EOF > lib/core/config/env.dart
          class Env {
            static const supabaseUrl = "${{ secrets.SUPABASE_URL }}";
            static const supabaseAnonKey = "${{ secrets.SUPABASE_ANON_KEY }}";
            static const googleMapsApiKey = "${{ secrets.GOOGLE_MAPS_API_KEY }}";
          }
          EOF

      # 🌐 Inject Google Maps API Key into Web
      - name: Inject Google Maps API Key
        run: |
          sed -i 's|YOUR_GOOGLE_MAPS_KEY|${{ secrets.GOOGLE_MAPS_API_KEY }}|g' web/index.html

      # 🔎 Analyze
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 🧪 Tests
      - name: Run tests
        run: flutter test
        continue-on-error: true

      # 🌐 Build Web
      - name: Build Web
        run: flutter build web --release

      # 📱 Build APK
      - name: Build APK
        run: flutter build apk --release

      # 🏷 Rename APK
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk aikora-sora.apk

      # ☁️ Upload artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aikora-sora-apk
          path: aikora-sora.apk
          retention-days: 30

      # 🚀 GitHub Release
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Aikōra Sora v1.0.${{ github.run_number }}"
          body: |
            🎉 Nueva versión de Aikōra Sora

            Release automático generado desde commit ${{ github.sha }}

            📦 Descargas:
            - Android APK incluido
          files: aikora-sora.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🌍 Deploy Web to GitHub Pages
      - name: Deploy Web
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web