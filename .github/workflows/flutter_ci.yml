name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK + Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create env.dart
        run: |
          mkdir -p lib/core/config
          printf 'class Env {\n  static const supabaseUrl = "%s";\n  static const supabaseAnonKey = "%s";\n  static const googleMapsApiKey = "%s";\n  static const groqApiKey = "%s";\n}\n' \
            "${{ secrets.SUPABASE_URL }}" \
            "${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            "${{ secrets.GROQ_API_KEY }}" \
            > lib/core/config/env.dart

      - name: Inject Google Maps API Key
        run: |
          sed -i 's|YOUR_GOOGLE_MAPS_KEY|${{ secrets.GOOGLE_MAPS_API_KEY }}|g' web/index.html

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build Web
        run: flutter build web --release

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk aikora-sora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aikora-sora-apk
          path: aikora-sora.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Aikōra Sora v1.0.${{ github.run_number }}"
          body: |
            🎉 Nueva versión de Aikōra Sora
            Release automático desde commit ${{ github.sha }}
            📦 Android APK incluido
          files: aikora-sora.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Web
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web